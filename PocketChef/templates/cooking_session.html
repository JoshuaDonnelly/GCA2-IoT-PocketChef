{% extends "base.html" %}

{% block title %}Cooking Session{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='js/session.js') }}"></script>

<div class="cooking-session">
        <!--Meat Image-->
        <div class="cooking-session-image">
            <img src="{{ image_url }}" alt="{{ meat_name }}">
            <div class="cooking-session-title">{{ meat_name }}</div>
        </div>

        <div class="cooking-session-panel">
            <div class="temp-display">
                <span>Live Thermometer: </span>
                <span id="temp">--</span> °C
            </div>
            <!--Metric Toggle-->
            <div class = "toggleMetric">Metric System</div>
            <label class="switch">
                <input type="checkbox" checked onchange="toggleMetricSystem()">
                <span class="slider round"></span>
            </label>

            <!--Weight Slider-->
            <div class ="weightRange">Weight</div>
            <div class="cooking-session-weight">
                 <input id="weightSlider" class="weightSlider" type="range" min="0" max="10" step="0.1" value="1.0">
            </div>
            <div class="weightValue">
              <span id="currentWeight"></span> Kg
            </div>

            <!--Desired Temperature Slider-->
            <div class ="tempRange">Desired Temperature</div>
            <div class="cooking-session-desired-temp">
                 <input id="tempSlider" class="tempSlider" type="range" min="50" max="250" step="1" value="74.0">
            </div>
            <div class="tempValue">
              <span id="currentTemp"></span> °C
            </div>
            

            <span class="cooking-session-badge">Ideal Temp: 74 °C</span>

            <!--Timer-->
            <div class="cooking-session-timer" id="timer">15:00</div>
                <div class="timer-start">
                    <button class="cooking-session-button" id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
                </div>
            <div class="timer-controls">
                <button class="cooking-session-button" onclick="adjustTime(-1)">- 1 Min</button>
                <button class="cooking-session-button" onclick="adjustTime(1)">+ 1 Min</button>
            </div>

            <!--Save Session-->
            <button class="cooking-session-button save-button" onclick="saveCookingSession()">💾 Save Session</button>

            <!-- Add live thermometer display -->
            
        </div>
    </div>
<script id="loaded-session-data" type="application/json">
  {{ loaded_session|default(none)|tojson }}
</script>

<script>
const raw = document.getElementById('loaded-session-data').textContent.trim() || 'null';
let loadedSession = null;
try {
  loadedSession = JSON.parse(raw);
} catch (e) {
  console.error("Failed to parse loadedSession JSON", e, raw);
}

document.addEventListener("DOMContentLoaded", () => {
  if (!loadedSession) return;

  // weight
  const weightSlider = document.getElementById('weightSlider');
  if (weightSlider && loadedSession.weight != null) {
    weightSlider.value = loadedSession.weight;
    if (typeof window.updateWeightDisplay === "function") {
      window.updateWeightDisplay();
    }
  }

  // desired temp
  const tempSlider = document.getElementById('tempSlider');
  if (tempSlider && loadedSession.desired_temp != null) {
    tempSlider.value = loadedSession.desired_temp;
    if (typeof window.updateTempDisplay === "function") {
      window.updateTempDisplay();
    }
  }

  // metric toggle
   if (typeof window.setMetricMode === "function" &&
      typeof loadedSession.is_metric !== "undefined") {
    window.setMetricMode(!!loadedSession.is_metric);
  }

  // timer
  if (typeof loadedSession.timer_seconds === "number") {
    window.timerSeconds = loadedSession.timer_seconds;
    if (typeof window.updateTimerDisplay === "function") {
      window.updateTimerDisplay();
    }
  }
});
</script>
<script>    
    function saveCookingSession() {
        console.log("DEBUG: saveCookingSession called");
        
        // Parse live temperature for payload
        const rawTemp = (document.getElementById('temp').textContent || '').trim();
        const tempValue = parseFloat(rawTemp);

        //Parse weight for payload
        const weightSlider = document.getElementById('weightSlider');
        const weight = weightSlider ? parseFloat(weightSlider.value): null;

        //Parse desired temp for payload
        const tempSlider = document.getElementById('tempSlider');
        const desiredTemp = tempSlider ? parseFloat(tempSlider.value): null;

        // Parse if metric system is used
        const checkBox = document.querySelector('.switch input').checked;
        const isMetric = checkBox ? true : false; //true is metric, false is imperial

        const idealTemp = 74; //Hardcoded for now

        const timerSeconds = typeof window.timerSeconds === "number" ? window.timerSeconds : 0;

        const imageUrl = "{{ image_url|default('') }}"
        
        const payload = {
            device_id: "web-ui",
            meat_type: "{{ meat_name }}",
            image_url: imageUrl,
            target_temp: idealTemp,
            actual_temp: isNaN(tempValue) ? null : tempValue,
            start_time: new Date().toISOString().slice(0, 19).replace("T", " "),
            end_time: new Date().toISOString().slice(0, 19).replace("T", " "),
            notes: "Saved from web UI",
            weight: isNaN(weight) ? null : weight,
            desired_temp: isNaN(desiredTemp) ? null : desiredTemp,
            is_metric: isMetric,
            timer_seconds: timerSeconds
        };
        
        console.log("DEBUG: Payload:", payload);

        fetch("/api/cooking_sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => {
            console.log("DEBUG: Response status:", res.status);
            if (!res.ok) {
                return res.text().then(text => {
                    console.error("DEBUG: Error response:", text);
                    throw new Error(`Failed to save session: ${res.status} - ${text}`);
                });
            }
            return res.json();
        })
        .then(data => {
            console.log("DEBUG: Success response:", data);
            alert("Cooking session saved!");
        })
        .catch(err => {
            console.error("DEBUG: Fetch error:", err);
            alert("Error saving session: " + err.message);
        });
    }
</script>
{% endblock %}
