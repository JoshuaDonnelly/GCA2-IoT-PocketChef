{% extends "base.html" %}

{% block title %}My Sessions{% endblock %}

{% block content %}
<h1>My Saved Sessions</h1>

<div id="sessions">Loading…</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  fetch("/api/cooking_sessions")
    .then(res => {
      if (!res.ok) throw new Error("Failed to load sessions");
      return res.json();
    })
    .then(rows => {
      const container = document.getElementById("sessions");
      if (!rows || rows.length === 0) {
        container.textContent = "No sessions saved yet.";
        return;
      }

      const list = document.createElement("ul");
      rows.forEach(s => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `/session/${s.id}`;
        a.textContent =
          `${s.meat_type || "Unknown meat"} | ` +
          `Target: ${s.target_temp ?? "-"}° | ` +
          `Actual: ${s.actual_temp ?? "-"}° | ` +
          `Timer: ${s.timer_seconds ?? 0}s | ` +
          `Start: ${s.start_time}`;
        li.appendChild(a);
        list.appendChild(li);
      });
      container.innerHTML = "";
      container.appendChild(list);
    })
    .catch(err => {
      document.getElementById("sessions").textContent =
        "Error loading sessions: " + err.message;
      console.error(err);
    });
});
</script>
{% endblock %}
